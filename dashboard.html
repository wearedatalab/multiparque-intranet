<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio · Intranet Multiparque</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#262161">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Multiparque">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="description" content="Intranet corporativa de Multiparque: noticias, directorio, documentos y calendarios del parque en un solo lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="page">
  <div class="container">

    <!-- Saludo personalizado -->
    <section class="hello rise" id="hello"></section>

    <!-- Comunicado fijado -->
    <div id="pinned-slot"></div>

    <div class="dash">
      <div class="dash__col">
        <!-- Noticias recientes -->
        <section class="card widget rise rise-1">
          <div class="widget__head">
            <h3><span class="dot"></span> Noticias recientes</h3>
            <a href="noticias.html">Ver todas →</a>
          </div>
          <div id="w-news"></div>
        </section>

        <!-- Accesos rápidos -->
        <section class="rise rise-2">
          <div class="widget__head" style="margin-bottom:14px">
            <h3>Tus accesos rápidos</h3>
            <span class="badge badge--soft">Según tu rol</span>
          </div>
          <div class="quicklinks" id="w-quick"></div>
        </section>

        <!-- Documentos frecuentes -->
        <section class="card widget rise rise-3">
          <div class="widget__head">
            <h3><span class="dot" style="background:var(--cyan)"></span> Documentos de uso frecuente</h3>
            <a href="documentos.html">Ir al gestor →</a>
          </div>
          <div id="w-docs"></div>
        </section>
      </div>

      <div class="dash__col">
        <!-- Próximos eventos -->
        <section class="card widget rise rise-2">
          <div class="widget__head">
            <h3><span class="dot" style="background:var(--yellow)"></span> Próximos eventos</h3>
            <a href="calendario.html">Calendario →</a>
          </div>
          <div id="w-events"></div>
        </section>

        <!-- Cumpleaños -->
        <section class="card widget rise rise-3">
          <div class="widget__head">
            <h3>🎂 Cumpleaños de julio</h3>
          </div>
          <div id="w-bdays"></div>
        </section>

        <!-- Tu equipo -->
        <section class="card widget rise rise-4">
          <div class="widget__head">
            <h3>👋 Compañeros de tu zona</h3>
            <a href="directorio.html">Directorio →</a>
          </div>
          <div id="w-team"></div>
        </section>
      </div>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  MP.renderShell('dashboard');
  const me = MP.me();

  /* ---------- Saludo ---------- */
  const hora = new Date().getHours(); // saluda según la hora real de quien ve la demo
  const saludo = hora < 12 ? '¡Buenos días' : (hora < 19 ? '¡Buenas tardes' : '¡Buenas noches');
  const rolDesc = {
    direccion: 'Este es el pulso del parque hoy: comunicados, equipo y operación en un solo vistazo.',
    talento: 'Tu gente te espera: cumpleaños, nuevos ingresos y los documentos de Talento Humano al día.',
    comunicaciones: 'Tienes el megáfono: publica noticias, revisa el calendario y mantén al parque informado.',
    colaborador: 'Esto es lo que necesitas para tu jornada en ' + me.zona + '.',
    jefe: 'Esto es lo que tu equipo necesita saber hoy en ' + me.zona + '.',
    admin: 'Plataforma estable y al día. Revisa usuarios, consumo y personalización cuando quieras.'
  };
  document.getElementById('hello').innerHTML =
    '<span class="blob blob--float" style="width:190px;height:190px;background:rgba(186,215,49,.14);top:-50px;right:-30px"></span>' +
    '<span class="blob" style="width:120px;height:120px;background:rgba(0,174,239,.16);bottom:-40px;right:16%"></span>' +
    '<h1>' + saludo + ', ' + me.nombre.split(' ')[0] + '! 👋</h1>' +
    '<p>' + rolDesc[me.rol] + '</p>' +
    '<div class="hello__meta">' +
      '<span>Hoy es <b>jueves, 23 de julio de 2026</b></span>' +
      '<span>' + me.cargo + ' · <b>' + me.area + '</b></span>' +
      '<span>📍 ' + me.zona + '</span>' +
    '</div>';

  /* ---------- Comunicado fijado ---------- */
  const fijado = MP.NEWS.find(n => n.fijado);
  if(fijado){
    document.getElementById('pinned-slot').innerHTML =
      '<div class="pinned rise rise-1" onclick="MP.openNews(\'' + fijado.id + '\')">' +
        '<span class="pinned__pin">📌</span>' +
        '<div><span class="badge badge--soft" style="margin-bottom:4px">Comunicado oficial</span>' +
        '<strong>' + fijado.titulo + '</strong><p>' + fijado.resumen + '</p></div>' +
      '</div>';
  }

  /* ---------- Noticias (personalizadas por rol) ---------- */
  const prefCat = { talento:'Talento Humano', comunicaciones:'Eventos', direccion:'Institucional' }[me.rol];
  let news = MP.NEWS.filter(n => !n.fijado);
  if(prefCat) news = news.sort((a,b) => (b.categoria === prefCat) - (a.categoria === prefCat) || b.fecha.localeCompare(a.fecha));
  document.getElementById('w-news').innerHTML = news.slice(0,4).map(n =>
    '<div class="newsrow" onclick="MP.openNews(\'' + n.id + '\')">' +
      (n.imagen ? '<img src="' + n.imagen + '" alt="">' : '<span class="newsrow__noimg">📣</span>') +
      '<div><span class="catbadge" style="background:' + MP.NEWS_CATS[n.categoria] + (n.categoria === 'Seguridad' ? ';color:var(--navy)' : '') + ';font-size:.6rem">' + n.categoria + '</span>' +
      '<strong style="margin-top:4px">' + n.titulo + '</strong>' +
      '<span class="small muted">' + MP.fmtFecha(n.fecha) + ' · ' + n.autor + '</span></div>' +
    '</div>').join('');

  /* ---------- Accesos rápidos ---------- */
  document.getElementById('w-quick').innerHTML = (MP.QUICK_LINKS[me.rol] || MP.QUICK_LINKS.colaborador).map(q =>
    '<a class="quicklink" href="' + q.href + '">' +
      '<span class="qicon">' + MP.icon(q.icono, 20) + '</span>' +
      '<strong>' + q.titulo + '</strong><span>' + q.sub + '</span></a>').join('');

  /* ---------- Documentos frecuentes (según área) ---------- */
  const visibles = MP.docsVisibles();
  let docs = visibles.filter(d => d.frecuente);
  const manualKarts = visibles.find(d => d.id === 'd05');
  if(me.area === 'Operaciones' && manualKarts) docs = [manualKarts].concat(docs.filter(d => d.id !== 'd05'));
  document.getElementById('w-docs').innerHTML = docs.slice(0,4).map(d =>
    '<div class="doclink" onclick="MP.openDoc(\'' + d.id + '\')">' +
      '<span class="docicon docicon--' + d.tipo + '" style="width:36px;height:36px;font-size:.55rem">' + d.tipo.toUpperCase() + '</span>' +
      '<div style="flex:1"><strong>' + d.titulo + '</strong>' +
      '<div class="small muted">' + d.version + ' · ' + d.visibilidad + '</div></div>' +
      '<span class="vbadge">' + d.version + '</span>' +
    '</div>').join('');

  /* ---------- Próximos eventos ---------- */
  const proximos = MP.EVENTS.filter(e => e.fecha >= '2026-07-23').slice(0,5);
  document.getElementById('w-events').innerHTML = proximos.map(e =>
    '<div class="eventrow" style="cursor:pointer" onclick="MP.openEvent(\'' + e.id + '\')">' +
      '<div class="datebox"><b>' + MP.diaNum(e.fecha) + '</b><span>' + MP.mesAbrev(e.fecha) + '</span></div>' +
      '<div class="eventrow__info"><strong>' + e.titulo + '</strong>' +
      '<span class="small muted">' + e.hora + ' · ' + e.lugar + '</span></div>' +
    '</div>').join('');

  /* ---------- Cumpleaños de julio ---------- */
  const cumples = MP.USERS.filter(u => u.cumple.startsWith('07-')).sort((a,b) => a.cumple.localeCompare(b.cumple));
  document.getElementById('w-bdays').innerHTML = cumples.map(u =>
    '<div class="bdayrow" style="cursor:pointer" onclick="MP.openPerson(\'' + u.id + '\')">' +
      MP.avatarHtml(u, 'avatar--sm') +
      '<div style="flex:1"><strong>' + u.nombre + '</strong>' +
      '<span class="small muted">' + u.cargo + '</span></div>' +
      '<span class="badge badge--soft">' + Number(u.cumple.split('-')[1]) + ' jul</span>' +
    '</div>').join('');

  /* ---------- Compañeros de zona ---------- */
  const equipo = MP.USERS.filter(u => u.id !== me.id && (u.zona === me.zona || u.area === me.area)).slice(0,4);
  document.getElementById('w-team').innerHTML = equipo.map(u =>
    '<div class="bdayrow" style="cursor:pointer" onclick="MP.openPerson(\'' + u.id + '\')">' +
      MP.avatarHtml(u, 'avatar--sm') +
      '<div style="flex:1"><strong>' + u.nombre + '</strong>' +
      '<span class="small muted">' + u.cargo + '</span></div>' +
    '</div>').join('');
</script>
</body>
</html>
